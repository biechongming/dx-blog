<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        :root {
            /* 默认值 = 你的闲人书斋配色 */
            --bg-color: #fefdf9;
            --text-color: #3a3228;
            --accent-color: #a06e3a;
            --border-color: #e3d9c8;
            --card-bg: rgba(254, 253, 249, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Serif SC", "Source Han Serif SC", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .countdown-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 24px rgba(160, 110, 58, 0.1);
            max-width: 520px;
            width: 100%;
        }

        .countdown-label {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 72px;
        }

        .time-value {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }

        .time-label {
            font-size: 0.78rem;
            margin-top: 0.4rem;
            color: var(--text-color);
            opacity: 0.55;
            letter-spacing: 1px;
        }

        .countdown-ended {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            padding: 1rem;
        }

        @media (max-width: 480px) {
            .time-value { font-size: 2rem; }
            .time-unit { min-width: 60px; }
            .countdown-wrapper { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="countdown-wrapper">
        <div class="countdown-label" id="label"></div>
        <div class="countdown-timer" id="timer">
            <div class="time-unit">
                <span class="time-value" id="days">00</span>
                <span class="time-label">天</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">时</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">分</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">秒</span>
            </div>
        </div>
        <div class="countdown-ended" id="ended" style="display:none;"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        // 读取参数（带中文 decode）
        const targetRaw = params.get('target');
        const label = decodeURIComponent(params.get('label') || '距离目标时间还有');
        const endText = decodeURIComponent(params.get('endtext') || '🎉 时间到！');
        const accent = params.get('accent') || '#a06e3a';
        const bg = params.get('bg') || '#fefdf9';
        const text = params.get('text') || '#3a3228';
        const border = params.get('border') || '#e3d9c8';

        // 应用颜色到 CSS 变量
        const root = document.documentElement;
        root.style.setProperty('--accent-color', accent);
        root.style.setProperty('--bg-color', bg);
        root.style.setProperty('--text-color', text);
        root.style.setProperty('--border-color', border);
        root.style.setProperty('--card-bg', bg + 'd9'); // 约 85% 不透明

        document.getElementById('label').textContent = label;

        // 解析目标时间
        if (!targetRaw) {
            document.getElementById('label').textContent = '⚠ 请在 URL 中加 ?target=时间戳或ISO日期';
            document.getElementById('timer').style.display = 'none';
            throw new Error('No target');
        }

        let targetDate = /^\d+$/.test(targetRaw)
            ? new Date(parseInt(targetRaw))
            : new Date(decodeURIComponent(targetRaw));

        if (isNaN(targetDate.getTime())) {
            document.getElementById('label').textContent = '⚠ 时间格式无效';
            document.getElementById('timer').style.display = 'none';
            throw new Error('Invalid date');
        }

        function update() {
            const diff = targetDate - new Date();
            if (diff <= 0) {
                document.getElementById('timer').style.display = 'none';
                const el = document.getElementById('ended');
                el.style.display = 'block';
                el.textContent = endText;
                clearInterval(timer);
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('days').textContent = String(d).padStart(2, '0');
            document.getElementById('hours').textContent = String(h).padStart(2, '0');
            document.getElementById('minutes').textContent = String(m).padStart(2, '0');
            document.getElementById('seconds').textContent = String(s).padStart(2, '0');
        }

        update();
        const timer = setInterval(update, 1000);
    </script>
</body>
</html>
